<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livebook in Popcorn</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="49x80" />
    <style>
      /* popcorn.swmansion.com's colors, see landing-page/ */
      :root {
        --cream: #fffdf5;
        --cream-soft: #fbf4e5;
        --ink: #301b05;
        --brown: #5f4122;
        --brown-muted: #9c8b79;
        --orange: #ef7c00;
        --green: #5e9a48;
        --red: #c03a17;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font: 13px/1.5 system-ui, sans-serif;
        color: var(--ink);
        background: var(--cream);
      }
      #bar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 40px;
        padding: 0 16px;
        background: var(--cream-soft);
        border-bottom: 1px solid var(--ink);
      }
      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin: 0;
        font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--brown);
      }
      #status-text,
      #notebook-vms {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #notebook-vms:not(:empty)::before {
        content: "·";
        margin-right: 8px;
        color: var(--brown-muted);
      }
      #status .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--orange);
      }
      #status[data-state="loading"] .dot {
        animation: pulse 1.2s ease-in-out infinite;
      }
      #status[data-state="ready"] .dot {
        background: var(--green);
      }
      #status[data-state="error"] .dot {
        background: var(--red);
      }
      #status[data-state="error"] #status-text {
        color: var(--red);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #status .dot {
          animation: none !important;
        }
      }
      #powered {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink);
        text-decoration: none;
        transition: color 0.15s;
      }
      #powered:hover,
      #powered:focus-visible {
        color: var(--orange);
      }
      /* The logo in the link's color */
      #powered .logo {
        width: 75px;
        height: 20px;
        background: currentColor;
        -webkit-mask: url("/popcorn-logo.svg") center / contain no-repeat;
        mask: url("/popcorn-logo.svg") center / contain no-repeat;
      }
      #powered .arrow {
        color: var(--orange);
      }
      @media (max-width: 480px) {
        #powered .by {
          display: none;
        }
      }
      iframe {
        flex: 1;
        border: 0;
      }
      /* Covers the page under the bar until Livebook's page is ready */
      #loader {
        position: fixed;
        inset: 41px 0 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--cream);
        transition: opacity 0.3s;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      /* Popcorn's mark, popping */
      #loader .mark {
        width: 49px;
        height: 80px;
        background: var(--ink);
        -webkit-mask: url("/favicon.svg") center / contain no-repeat;
        mask: url("/favicon.svg") center / contain no-repeat;
        transform-origin: 50% 100%;
        animation: pop 1.2s ease-in-out infinite;
      }
      #loader .shadow {
        width: 44px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
        opacity: 0.12;
        animation: shadow 1.2s ease-in-out infinite;
      }
      #loader[data-state="error"] .mark,
      #loader[data-state="error"] .shadow {
        animation: none;
      }
      @keyframes pop {
        0%,
        100% {
          transform: translateY(0) scale(1, 1);
        }
        15% {
          transform: translateY(0) scale(1.08, 0.9);
        }
        45% {
          transform: translateY(-22px) scale(0.96, 1.05);
        }
        75% {
          transform: translateY(0) scale(1.04, 0.96);
        }
      }
      @keyframes shadow {
        45% {
          transform: scale(0.6);
          opacity: 0.06;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader .mark,
        #loader .shadow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <p id="status" role="status" data-state="loading">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Loading VM…</span>
        <span id="notebook-vms"></span>
      </p>
      <a id="powered" href="https://popcorn.swmansion.com" target="_blank" rel="noreferrer" aria-label="Powered by Popcorn">
        <span class="by">Powered by</span>
        <span class="logo"></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </header>
    <div id="loader" data-state="loading" aria-hidden="true">
      <div class="mark"></div>
      <div class="shadow"></div>
    </div>
    <script type="module">
      // The shell owns the tab's VMs and outlives the iframe's navigations.
      // Livebook runs in the iframe under a path of its own, /tab/<id>/, whose
      // Service Worker sends the iframe's requests here, through a relay frame:
      // see sw.js. The iframe's WebSockets are created here.
      import { Popcorn, schedulers } from "/out/index.mjs";
      import { createTabRelay } from "/distribution.js";

      // The bar shows Livebook's VM's state: "loading", "ready" or "error". The
      // console also gets how long the step took, if given.
      const status = (text, state = "loading", ms = null) => {
        document.querySelector("#status").dataset.state = state;
        // The whole text, which the bar may cut
        Object.assign(document.querySelector("#status-text"), { textContent: text, title: text });
        updateLoader(state);
        console.log(`[shell] ${text}${ms === null ? "" : ` (${Math.round(ms)} ms)`}`);
      };

      // The loader follows the state too, until Livebook's page is first ready
      function updateLoader(state) {
        const loader = document.querySelector("#loader");
        if (!loader || loader.classList.contains("done")) return;
        if (state === "ready") {
          loader.classList.add("done");
          loader.addEventListener("transitionend", () => loader.remove(), { once: true });
          return;
        }
        loader.dataset.state = state;
      }

      // And how many VMs the notebooks have
      const notebookVms = { booting: 0, running: 0 };
      function showNotebookVms() {
        const { booting, running } = notebookVms;
        const vms = (count) => `${count} notebook VM${count === 1 ? "" : "s"}`;
        const parts = [];
        if (running) parts.push(`${vms(running)} running`);
        if (booting) parts.push(`${running ? booting : vms(booting)} starting…`);
        document.querySelector("#notebook-vms").textContent = parts.join(", ");
      }

      let onStarted;
      const started = new Promise((resolve) => (onStarted = resolve));
      const sockets = new Map();

      // Popcorn's limit on booting a VM includes downloading its files, which
      // take minutes on slow connections. LivebookWasm.Runtime waits longer.
      const timeoutsMs = { boot: 5 * 60_000 };

      const runtimes = new Map();
      // The notebooks' VMs boot a package of their own, see notebook_vm/
      const notebookVm = "/notebook_vm/otp/";

      async function handleRuntime({ livebook_runtime: action, node, cookie, pid }) {
        if (action === "start") {
          const t0 = performance.now();
          const runtime = Popcorn.init({
            distribution: relay,
            timeoutsMs,
            beam: {
              otpAssetsRoot: notebookVm,
              // Notebooks run Erlang code on 2 threads, Livebook on Popcorn's 1
              emulatorArgs: schedulers({ base: 2, dirtyCpu: 1, dirtyIo: 1 }),
              extraArgs: ["-name", node, "-setcookie", cookie],
            },
          });
          runtimes.set(node, runtime);
          notebookVms.booting++;
          showNotebookVms();
          try {
            await runtime;
            notebookVms.running++;
            console.log(`[shell] Runtime VM ${node} booted in ${Math.round(performance.now() - t0)} ms`);
          } catch (error) {
            // Livebook would wait for the node until it timed out
            const message = String(error?.message ?? error);
            console.warn(`[shell] Runtime VM ${node} didn't boot: ${message}`);
            runtimes.delete(node);
            popcorn.send(pid, { error: message });
          } finally {
            notebookVms.booting--;
            showNotebookVms();
          }
        } else if (action === "stop") {
          const runtime = runtimes.get(node);
          runtimes.delete(node);
          const vm = await runtime?.catch(() => null);
          if (vm) {
            vm.deinit();
            notebookVms.running--;
            showNotebookVms();
          }
          console.log(`[shell] Runtime VM ${node} stopped`);
        }
      }

      // Each page load picks the path, and holds a lock for it while it's open
      const tab = crypto.randomUUID();
      const base = `/tab/${tab}`;
      await new Promise((locked) =>
        navigator.locks.request(`livebook-tab:${tab}`, () => {
          locked();
          return new Promise(() => {});
        }),
      );

      // Livebook's VM and the notebooks' runtime VMs are Erlang nodes, which
      // the relay connects, also to other tabs' VMs: see distribution.js
      const relay = createTabRelay(tab);
      await removeClosedTabs();
      const workerReady = registerWorker().catch((error) => {
        status(`The Service Worker didn't start: ${error.message}`, "error");
        throw error;
      });

      // The workers of closed tabs, and of the example's earlier versions
      async function removeClosedTabs() {
        const { held } = await navigator.locks.query();
        const open = new Set(held.map((lock) => lock.name));
        for (const registration of await navigator.serviceWorker.getRegistrations()) {
          const id = new URL(registration.scope).pathname.match(/^\/tab\/([^/]+)\/$/)?.[1];
          if (!open.has(`livebook-tab:${id}`)) await registration.unregister();
        }
      }

      async function registerWorker() {
        const registration = await navigator.serviceWorker.register("/sw.js", { scope: `${base}/` });
        const worker = registration.installing ?? registration.waiting ?? registration.active;
        while (worker.state !== "activated") {
          if (worker.state === "redundant") throw new Error("it failed to install");
          await new Promise((resolve) => worker.addEventListener("statechange", resolve, { once: true }));
        }
      }

      const t0 = performance.now();
      const popcorn = await Popcorn.init({
        distribution: relay,
        timeoutsMs,
        // Livebook's URLs are under the tab's path, see LivebookWasm.Application
        beam: { extraArgs: ["-livebook_wasm_base_path", base] },
        onEvent: (event) => {
          if (event?.livebook) return onStarted(event);
          if (event?.livebook_runtime) return handleRuntime(event);
          const socket = event && sockets.get(event.popcorn_socket);
          if (!socket) return;
          if ("close" in event) socket.closed(event.close);
          else if ("text" in event) socket.onmessage?.({ data: event.text });
          else socket.onmessage?.({ data: socket.binaryFrame(toBytes(event.binary)) });
        },
      }).catch((error) => {
        status(`The VM didn't boot: ${error?.message ?? error}`, "error");
        throw error;
      });
      status("VM booted, starting Livebook…", "loading", performance.now() - t0);

      // Binary frames that are valid UTF-8 arrive as strings
      function toBytes(data) {
        return typeof data === "string" ? new TextEncoder().encode(data) : data;
      }

      // Responses built in JavaScript can't set cookies, so the shell keeps them
      const jar = new Map();

      // The shell sets these. The browser doesn't decode responses built in
      // JavaScript, so the VM mustn't compress them.
      const replaced = ["host", "cookie", "accept-encoding"];

      async function request(method, url, headers = [], body = "") {
        const target = new URL(url, location.href);
        // Livebook expects the tab's path removed, as a reverse proxy would
        if (target.pathname.startsWith(`${base}/`)) target.pathname = target.pathname.slice(base.length);
        const all = headers.filter(([name]) => !replaced.includes(name.toLowerCase()));
        all.push(["host", target.host]);
        if (jar.size) all.push(["cookie", [...jar].map(([k, v]) => `${k}=${v}`).join("; ")]);

        const resp = await popcorn.call(
          "livebook_wasm_plug",
          { method, url: target.href, headers: all, body },
          { timeoutMs: 120_000 },
        );

        for (const [name, value] of resp.headers ?? []) {
          if (name !== "set-cookie") continue;
          const [pair] = value.split(";");
          const i = pair.indexOf("=");
          const [key, val] = [pair.slice(0, i).trim(), pair.slice(i + 1).trim()];
          if (/max-age=0/i.test(value)) jar.delete(key);
          else jar.set(key, val);
        }
        return resp;
      }

      // A WebSocket whose other end is a socket process in the VM
      class PopcornWebSocket {
        static CONNECTING = 0;
        static OPEN = 1;
        static CLOSING = 2;
        static CLOSED = 3;

        constructor(url) {
          this.url = url;
          this.readyState = 0;
          this.bufferedAmount = 0;
          const target = new URL(url);
          target.protocol = target.protocol === "wss:" ? "https:" : "http:";
          const headers = [
            ["origin", location.origin],
            ["connection", "Upgrade"],
            ["upgrade", "websocket"],
            ["sec-websocket-key", "dGhlIHNhbXBsZSBub25jZQ=="],
            ["sec-websocket-version", "13"],
          ];
          request("GET", target.href, headers).then(
            (resp) => {
              if (resp.status !== 101) {
                console.warn(`[shell] WebSocket ${target.pathname} refused: ${resp.status}`);
                return this.closed(1006);
              }
              this.pid = resp.socket;
              this.id = resp.id;
              sockets.set(this.id, this);
              this.readyState = 1;
              this.onopen?.({});
            },
            (error) => {
              console.warn(`[shell] WebSocket ${target.pathname} failed: ${error?.message ?? error}`);
              this.closed(1006);
            },
          );
        }

        send(data) {
          popcorn.send(this.pid, typeof data === "string" ? { text: data } : { binary: data });
        }

        // Livebook's frame overrides it to make its own ArrayBuffers, see
        // popcorn-frame.js
        binaryFrame(bytes) {
          return bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        }

        close(code) {
          if (this.readyState === 3) return;
          if (this.pid) popcorn.send(this.pid, { close: code ?? 1000 });
          this.closed(code ?? 1000);
        }

        closed(code) {
          if (this.readyState === 3) return;
          this.readyState = 3;
          sockets.delete(this.id);
          this.onclose?.({ code, wasClean: code === 1000 });
        }
      }

      // Serves the requests that the Service Worker sends to the relay frame
      async function serve(req) {
        try {
          const resp = await request(req.method, req.url, req.headers, req.body);
          return { status: resp.status, headers: resp.headers ?? [], body: resp.body };
        } catch (error) {
          return { status: 502, headers: [], body: String(error?.message ?? error) };
        }
      }

      window.popcornBridge = { WebSocket: PopcornWebSocket, serve, base };

      await workerReady;
      const event = await started;
      window.livebookStarted = event;
      status("Livebook started, loading its page…", "loading", event.ms);

      // The relay frame goes first, as the Service Worker sends Livebook's
      // pages through it
      const relayFrame = addFrame(`${base}/popcorn-relay`, { hidden: true });
      await loaded(relayFrame);
      const relayFailure = frameFailure(relayFrame);
      if (relayFailure) status(`Livebook's page didn't load: ${relayFailure}`, "error");
      else await openLivebook();

      async function openLivebook() {
        // Livebook's links, like /import?url=…, open in the tab's Livebook
        const path = location.pathname === "/index.html" ? "/" : location.pathname;
        const frame = addFrame(`${base}${path}${location.search}`, { id: "livebook" });
        watchLivebook(frame, "Livebook started");
        await loaded(frame);

        // Livebook has opened the link by the time its page loads, so reloading
        // mustn't open it again
        history.replaceState(null, "", "/");

        // Now that Livebook's page has loaded, the HTTP cache gets the notebooks'
        // VMs' package, which their workers fetch as they boot. Their runtime is
        // Livebook's VM's, which the cache has.
        window.notebookVmPrefetched = prefetchNotebookVm().catch((error) =>
          console.warn(`[shell] Prefetching the notebooks' VM failed: ${error.message}`),
        );
      }

      // Why a frame's page didn't load, if it didn't. Its scripts and
      // stylesheets load from the server, as when it has stopped, and
      // popcorn-frame.js, which loads first, records those that fail.
      function frameFailure(frame) {
        let page;
        try {
          page = frame.contentWindow.popcornFrame;
        } catch {
          // The browser's error page, of another origin
          return "the browser couldn't open it";
        }
        const failed = page?.failed ?? ["/popcorn-frame.js"];
        const paths = failed.map((url) => new URL(url, location.href).pathname.replace(base, ""));
        return paths.length ? `${paths.join(", ")} failed` : null;
      }

      // Livebook's page is ready once its LiveView connects to the VM, through
      // the shell's WebSockets. The bar shows that, also for the pages that the
      // frame opens later, and when the connection drops.
      function watchLivebook(frame, ready) {
        let shown;
        let connected = false;
        let timer;
        let observer;
        const show = (text, state) => {
          if (text === shown) return;
          shown = text;
          status(text, state);
        };
        const giveUpAfter = (ms, text) => {
          clearTimeout(timer);
          timer = setTimeout(() => show(text, "error"), ms);
        };
        const check = (doc) => {
          // Leaving the page disconnects it, see popcorn-frame.js
          if (doc.defaultView?.popcornFrame?.leaving) return;
          const view = doc.querySelector("[data-phx-main]");
          if (view?.classList.contains("phx-connected")) {
            clearTimeout(timer);
            connected = true;
            show(ready, "ready");
          } else if (view?.classList.contains("phx-error")) {
            const text = connected
              ? "Livebook's page lost its connection to the VM, reconnecting…"
              : "Livebook's page didn't connect to the VM, retrying…";
            show(text, "error");
          }
        };

        // Loading the page downloads its files, like booting the VM, and
        // connecting goes through the VM only
        giveUpAfter(timeoutsMs.boot, "Livebook's page didn't load");
        frame.addEventListener("load", () => {
          observer?.disconnect();
          const failure = frameFailure(frame);
          if (failure) {
            clearTimeout(timer);
            return show(`Livebook's page didn't load: ${failure}`, "error");
          }
          // LiveView sets the classes of its view's element
          const doc = frame.contentDocument;
          const pageObserver = new MutationObserver(() => check(doc));
          pageObserver.observe(doc, { subtree: true, childList: true, attributeFilter: ["class"] });
          observer = pageObserver;
          // Then the frame loads the next page
          frame.contentWindow.addEventListener("pagehide", () => {
            pageObserver.disconnect();
            giveUpAfter(timeoutsMs.boot, "Livebook's page didn't load");
          });
          giveUpAfter(30_000, "Livebook's page didn't connect to the VM");
          check(doc);
        });
      }

      async function prefetchNotebookVm() {
        const resp = await fetch(`${notebookVm}manifest.json`);
        if (!resp.ok) throw new Error(`manifest.json: HTTP ${resp.status}`);
        const { bundles } = await resp.json();
        // The VMs load Elixir's and Erlang's docs after boot, see notebook_vm/
        const urls = [...Object.values(bundles).map(({ tar }) => notebookVm + tar), "/notebook_vm/docs.tar"];
        await Promise.all(
          urls.map(async (url) => {
            const bundle = await fetch(url, { priority: "low" });
            await bundle.arrayBuffer();
          }),
        );
      }

      function addFrame(src, props) {
        const frame = Object.assign(document.createElement("iframe"), props, { src });
        document.body.append(frame);
        return frame;
      }

      function loaded(frame) {
        return new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      }
    </script>
  </body>
</html>
