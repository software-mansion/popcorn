worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  server {
    port_in_redirect off;
    listen       80;
    listen  [::]:80;
    # Burrito's port, which the hosts' popcorn-burrito.yml routes to, as
    # .github/workflows/demo_deploy.yml publishes Livebook as burrito for now
    listen       4000;
    listen  [::]:4000;
    server_name  popcorn;

    # Popcorn's VMs need the page to be cross-origin isolated
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # The files' names don't change with their contents, so browsers revalidate
    add_header Cache-Control "no-cache" always;

    root   /usr/share/nginx/html;
    index  index.html;
    include /etc/nginx/mime.types;
    types {
            application/javascript mjs;
    }

    # Livebook's assets and Popcorn's packages have gzipped copies
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;

    location / {
            try_files $uri $uri/ @page;
    }

    # As examples/livebook/serve.exs does: the shell page for navigations to
    # other paths, like Livebook's links to /import?url=…, see its README
    location @page {
            if ($http_accept !~* "text/html") {
                    return 404;
            }
            rewrite ^ /index.html break;
    }
  }
}
