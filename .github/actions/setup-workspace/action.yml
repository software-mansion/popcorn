name: Setup Workspace
description: Restore optional OTP Wasm cache and install Elixir/Erlang and/or Node.js/pnpm dependencies

inputs:
  wasm:
    description: OTP Wasm runtime cache to restore (core, crypto, both, or empty to skip)
    required: false
    default: ""
  elixir:
    description: Install Erlang/OTP and Elixir from mise.toml
    required: false
    default: "false"
  node:
    description: Install pnpm and Node.js and run pnpm install
    required: false
    default: "false"
  registry-url:
    description: Optional npm registry URL for setup-node
    required: false
    default: ""
  build-popcorn-js:
    description: Build @swmansion/popcorn JS package after installing workspace deps
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: toolchain
      uses: ./.github/actions/read-otp-toolchain

    - name: Restore core OTP Wasm
      if: inputs.wasm == 'core' || inputs.wasm == 'both'
      uses: actions/cache/restore@v4
      with:
        path: popcorn/out
        key: ${{ steps.toolchain.outputs.core-cache-key }}
        fail-on-cache-miss: true

    - name: Restore crypto OTP Wasm
      if: inputs.wasm == 'crypto' || inputs.wasm == 'both'
      uses: actions/cache/restore@v4
      with:
        path: popcorn/out
        key: ${{ steps.toolchain.outputs.crypto-cache-key }}
        fail-on-cache-miss: true

    - name: Setup Elixir and Erlang
      if: inputs.elixir == 'true'
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ steps.toolchain.outputs.otp }}
        elixir-version: ${{ steps.toolchain.outputs.elixir }}

    - name: Setup pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.toolchain.outputs.node }}
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - name: Install JS dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build Popcorn JS package
      if: inputs.build-popcorn-js == 'true'
      shell: bash
      run: pnpm -F ./popcorn/js build
