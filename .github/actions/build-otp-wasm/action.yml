name: Build OTP Wasm
description: Install the build toolchain, restore caches, and build OTP/BEAM for Wasm

inputs:
  build-mode:
    description: Build mode passed to scripts/build-beam.sh
    required: false
    default: release
  otp-tag:
    description: OTP git tag to build for Wasm
    required: false
    default: OTP-29.0.6
  host-otp-version:
    description: OTP release installed on the runner to bootstrap the build.
    required: true
  with-crypto:
    description: Build with static OpenSSL-backed crypto/asn1 support
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: toolchain
      uses: ./.github/actions/read-otp-toolchain

    - name: Compute OTP build cache key
      id: otp-build-cache-key
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "key=otp-wasm-${{ runner.os }}-${{ inputs.otp-tag }}-${{ inputs.build-mode }}-${{ inputs.with-crypto }}-${{ steps.toolchain.outputs.wasm-hash }}"
          echo "openssl_key=openssl-wasm-${{ runner.os }}-3.0.15-${{ inputs.build-mode }}-${{ steps.toolchain.outputs.openssl-hash }}"
        } >> "$GITHUB_OUTPUT"

    - name: Cache built OTP output
      id: otp-build-cache
      uses: actions/cache@v4
      with:
        path: popcorn/out
        key: ${{ steps.otp-build-cache-key.outputs.key }}

    - name: Reuse cached OTP/BEAM build
      if: steps.otp-build-cache.outputs.cache-hit == 'true'
      shell: bash
      run: echo "Using cached OTP Wasm build from popcorn/out"

    # scripts/build-beam.sh needs emconfigure and an erlc to compile the
    # preloaded modules the native bootstrap emulator embeds.
    - name: Setup emsdk
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 6.0.13
        actions-cache-folder: emsdk-cache

    - name: Setup bootstrap Erlang
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        # setup-beam always installs into $RUNNER_TEMP/.setup-beam, we need to avoid having
        # two installs with different version
        otp-version: ${{ inputs.host-otp-version }}

    - name: Check autoconf 2.72
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        if ! autoconf --version | head -n 1 | grep -q "2.72"; then
          echo "::error::OTP build requires autoconf 2.72, provided by the ubuntu-26.04 runner"
          exit 1
        fi

    - name: Cache OTP clone
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: popcorn/sources/otp-original
        key: otp-clone-${{ runner.os }}-${{ inputs.otp-tag }}

    - name: Cache OpenSSL
      if: steps.otp-build-cache.outputs.cache-hit != 'true' && inputs.with-crypto == 'true'
      uses: actions/cache@v4
      with:
        path: |
          popcorn/sources/openssl-3.0.15-${{ inputs.build-mode }}
          popcorn/sources/openssl-3.0.15-${{ inputs.build-mode }}-installed
        key: ${{ steps.otp-build-cache-key.outputs.openssl_key }}

    - name: Setup ccache
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ccache &> /dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
        fi

    - name: Cache ccache
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-otp-wasm-${{ runner.os }}-${{ inputs.otp-tag }}-${{ inputs.build-mode }}-${{ inputs.with-crypto }}-${{ github.sha }}
        restore-keys: |
          ccache-otp-wasm-${{ runner.os }}-${{ inputs.otp-tag }}-${{ inputs.build-mode }}-${{ inputs.with-crypto }}-

    - name: Build OTP/BEAM for Wasm
      if: steps.otp-build-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        EM_COMPILER_WRAPPER: ccache
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: "1"
        CCACHE_COMPRESS: "1"
        CCACHE_MAXSIZE: 1G
        CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
      run: |
        set -euo pipefail
        ccache --zero-stats

        build_args=(--otp-tag "${{ inputs.otp-tag }}" "${{ inputs.build-mode }}")
        if [[ "${{ inputs.with-crypto }}" == "true" ]]; then
          build_args=(--with-crypto "${build_args[@]}")
        fi

        scripts/build-beam.sh "${build_args[@]}"
        ccache --show-stats
