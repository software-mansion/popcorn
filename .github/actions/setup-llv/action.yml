name: Setup LocalLiveView
description: >-
  Build the OTP/BEAM Wasm runtime and Popcorn's JS package, and install the
  toolchain and JS dependencies for LocalLiveView and its examples

inputs:
  build-mode:
    description: BEAM Wasm build mode
    default: debug

runs:
  using: composite
  steps:
    - name: Build OTP/BEAM for Wasm
      uses: ./.github/actions/build-otp-wasm
      with:
        host-otp-version: "29.0.6"
        build-mode: ${{ inputs.build-mode }}
        with-crypto: "true"

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: "1.20.4"
        otp-version: "29.0.6"

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml

    - name: Install JS dependencies
      shell: bash
      run: pnpm install

    - name: Build Popcorn JS package
      shell: bash
      run: pnpm -F ./popcorn/js build
