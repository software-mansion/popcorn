name: Setup LocalLiveView
description: >-
  Build the OTP/BEAM Wasm runtime and Popcorn's JS package, and install the
  toolchain and JS dependencies for LocalLiveView and its examples

inputs:
  build-mode:
    description: BEAM Wasm build mode
    default: release

runs:
  using: composite
  steps:
    - id: toolchain
      uses: ./.github/actions/read-otp-toolchain

    - name: Build OTP/BEAM for Wasm
      uses: ./.github/actions/build-otp-wasm
      with:
        host-otp-version: ${{ steps.toolchain.outputs.otp }}
        otp-tag: ${{ steps.toolchain.outputs.otp-tag }}
        build-mode: ${{ inputs.build-mode }}
        with-crypto: "true"

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ steps.toolchain.outputs.elixir }}
        otp-version: ${{ steps.toolchain.outputs.otp }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.toolchain.outputs.node }}
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build Popcorn JS package
      shell: bash
      run: pnpm -F ./popcorn/js build
