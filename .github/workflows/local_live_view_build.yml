# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: LocalLiveView Build & test

on:
  push:
    branches: ["**"]
    paths:
      - "local-live-view/**"
      - ".github/workflows/local_live_view_build.yml"
      # LocalLiveView runs on Popcorn from this repo
      - "popcorn/elixir/**"
      - "popcorn/js/**"
      - "popcorn/patches/**"
      - "scripts/build-beam.sh"
      - ".github/actions/build-otp-wasm/action.yml"
      - ".github/actions/setup-llv/action.yml"
      - ".github/actions/setup-playwright/action.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  MIX_ENV: test
  # The e2e suite in test/e2e uses the runner's preinstalled Google Chrome
  # instead of downloading Playwright's bundled chromium (that download hangs
  # on the runner). Read by test/e2e/playwright/playwright.config.js.
  PW_CHANNEL: chrome

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: local-live-view

    steps:
      - uses: actions/checkout@v4

      - name: Setup LocalLiveView
        uses: ./.github/actions/setup-llv

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: local-live-view/deps
          key: ${{ runner.os }}-mix-local_live_view-${{ hashFiles('local-live-view/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-local_live_view-

      - name: Install Hex dependencies
        run: mix deps.get

      - name: Install Phoenix installer (needed by Igniter.Test.phx_test_project)
        run: mix archive.install hex phx_new --force

      - name: Compile Hex dependencies
        run: mix deps.compile

      # priv/static/ is generated and not committed. `mix llv.assets` (run by
      # `mix llv.build`, and by hex.publish at release time) would build it on
      # demand anyway; doing it up front keeps the failure attributable to the
      # bundler rather than to whichever test needed the bundle first.
      - name: Build JS bundle
        run: mix llv.assets

      - name: Typecheck, lint & format (JS)
        run: pnpm run ci
        working-directory: local-live-view

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Lint
        run: mix lint

      - name: Test
        run: mix test
