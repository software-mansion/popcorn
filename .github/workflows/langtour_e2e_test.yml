name: Language Tour Build & test

on:
  push:
    branches: ["**"]
    paths:
      - "language-tour/**"
      - ".github/workflows/langtour_e2e_test.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"

permissions:
  contents: read

env:
  CI: true

jobs:
  e2e:
    name: Language Tour E2E tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build OTP/BEAM for Wasm
        uses: ./.github/actions/build-otp-wasm
        with:
          host-otp-version: &host_otp "29.0.6"
          build-mode: debug
          with-crypto: "false"

      - name: Set up Elixir
        uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
        with:
          elixir-version: "1.20.4"
          otp-version: *host_otp

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Elixir dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: mix deps.get
        working-directory: language-tour/elixir_tour

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build popcorn JS package
        run: pnpm -F ./popcorn/js build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: language-tour

      - name: Run e2e tests
        run: pnpm test
        working-directory: language-tour
