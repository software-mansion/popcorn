name: Language Tour Build & test

on:
  push:
    branches: ["**"]
    paths:
      - "language-tour/**"
      - "popcorn/**"
      - ".github/workflows/langtour_e2e_test.yml"
      - ".github/actions/build-otp-wasm/action.yml"
      - ".github/actions/read-otp-toolchain/action.yml"
      - ".github/actions/setup-mix-cache/action.yml"
      - ".github/actions/setup-playwright/action.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  e2e:
    name: Language Tour E2E tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - id: toolchain
        uses: ./.github/actions/read-otp-toolchain

      - name: Build OTP/BEAM for Wasm
        uses: ./.github/actions/build-otp-wasm
        with:
          host-otp-version: ${{ steps.toolchain.outputs.otp }}
          otp-tag: ${{ steps.toolchain.outputs.otp-tag }}
          build-mode: debug
          with-crypto: "false"

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Elixir dependencies
        uses: ./.github/actions/setup-mix-cache
        with:
          working-directory: language-tour/elixir_tour
          mix-env: dev

      - name: Install Elixir dependencies
        run: mix deps.get
        working-directory: language-tour/elixir_tour

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build popcorn JS package
        run: pnpm -F ./popcorn/js build

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          version: "1.63.0"

      - name: Run e2e tests
        run: pnpm test
        working-directory: language-tour

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: language-tour-playwright
          path: |
            language-tour/playwright-report/
            language-tour/test-results/
          retention-days: 7
