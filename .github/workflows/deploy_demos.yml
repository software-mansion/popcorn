name: Deploy Demos

on:
  push:
    branches:
      - main
    paths:
      - "landing-page/**"
      - "language-tour/**"
      - "examples/local-lv-burrito/**"
      - "local-live-view/**"
      - "popcorn/elixir/**"
      - "popcorn/js/**"
      - "popcorn/patches/**"
      - "popcorn/emscripten/**"
      - "scripts/_common.sh"
      - "scripts/build-beam.sh"
      - "scripts/build-openssl.sh"
      - "scripts/export-otp-apps.escript"
      - "scripts/patch-beam.sh"
      - "scripts/runtime-manifest.sh"
      - "docker/**"
      - ".github/workflows/deploy_demos.yml"
      - ".github/workflows/_build_otp.yml"
      - ".github/actions/build-otp-wasm/**"
      - ".github/actions/read-otp-toolchain/**"
      - ".github/actions/setup-workspace/**"
      - "mise.toml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        type: choice
        options:
          - staging
          - production
        default: staging
      landing:
        description: Deploy landing page
        type: boolean
        default: true
      langtour:
        description: Deploy language tour
        type: boolean
        default: true
      burrito:
        description: Deploy burrito demo
        type: boolean
        default: true

concurrency:
  group: demo-deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: ${{ (inputs.environment || 'staging') != 'production' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  ORG_NAME: software-mansion
  TARGET_ENV: ${{ inputs.environment || 'staging' }}
  IMAGE_TAG: ${{ (inputs.environment || 'staging') == 'production' && 'latest' || 'staging' }}

jobs:
  wasm:
    name: Build OTP
    if: github.event_name == 'push' || inputs.landing || inputs.langtour || inputs.burrito
    uses: ./.github/workflows/_build_otp.yml
    with:
      core: ${{ github.event_name == 'push' || inputs.landing || inputs.langtour }}
      crypto: ${{ github.event_name == 'push' || inputs.landing || inputs.burrito }}

  build-base:
    name: Base image
    if: github.event_name == 'push' || inputs.landing || inputs.langtour || inputs.burrito
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      apps: ${{ steps.select.outputs.apps }}

    steps:
      - id: select
        env:
          IS_PUSH: ${{ github.event_name == 'push' }}
          DEPLOY_LANDING: ${{ inputs.landing }}
          DEPLOY_LANGTOUR: ${{ inputs.langtour }}
          DEPLOY_BURRITO: ${{ inputs.burrito }}
        run: |
          apps='[]'
          if [[ "$IS_PUSH" == "true" || "$DEPLOY_LANDING" == "true" ]]; then
            apps=$(jq -c '. + [{"name":"landing","file":"./docker/landing.Dockerfile","image":"popcorn-landing","wasm":"both"}]' <<< "$apps")
          fi
          if [[ "$IS_PUSH" == "true" || "$DEPLOY_LANGTOUR" == "true" ]]; then
            apps=$(jq -c '. + [{"name":"langtour","file":"./docker/langtour.Dockerfile","image":"popcorn-langtour","wasm":"core"}]' <<< "$apps")
          fi
          if [[ "$IS_PUSH" == "true" || "$DEPLOY_BURRITO" == "true" ]]; then
            apps=$(jq -c '. + [{"name":"burrito","file":"./docker/burrito/Dockerfile","image":"popcorn-burrito","wasm":"crypto"}]' <<< "$apps")
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: "false"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-base

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-base:latest
            ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-base:staging
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-cache:base
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-cache:base,mode=max

  build-apps:
    name: Build ${{ matrix.app.name }} (${{ inputs.environment || 'staging' }})
    needs: [wasm, build-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.build-base.outputs.apps) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "false"

      - uses: ./.github/actions/setup-workspace
        with:
          wasm: ${{ matrix.app.wasm }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.app.image }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.file }}
          build-args: |
            POPCORN_BASE_TAG=latest
            SYNC_THIRD_PARTY_ASSETS=true
            SENTRY_DSN=${{ secrets.SENTRY_CLIENT_DSN }}
            SENTRY_MODE=${{ env.TARGET_ENV }}
            APP_VERSION=${{ github.sha }}
          pull: true
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: "${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.app.image }}:${{ env.IMAGE_TAG }}"
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-cache:${{ matrix.app.name }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG_NAME }}/popcorn-cache:${{ matrix.app.name }},mode=max

  deploy:
    name: Deploy (${{ inputs.environment || 'staging' }})
    needs: build-apps
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Deploy to ${{ env.TARGET_ENV }}
        uses: appleboy/ssh-action@v1
        env:
          BURRITO_SECRET_KEY_BASE: ${{ secrets.BURRITO_SECRET_KEY_BASE }}
          DEPLOY_LANDING: ${{ github.event_name == 'push' || inputs.landing }}
          DEPLOY_LANGTOUR: ${{ github.event_name == 'push' || inputs.langtour }}
          DEPLOY_BURRITO: ${{ github.event_name == 'push' || inputs.burrito }}
        with:
          host: ${{ env.TARGET_ENV == 'production' && secrets.POPCORN_HOSTS || secrets.STAG_POPCORN_HOST }}
          username: ${{ secrets.POPCORN_USER }}
          key: ${{ secrets.POPCORN_SSH_PRIV }}
          port: ${{ env.TARGET_ENV == 'production' && secrets.POPCORN_PORT || secrets.STAG_POPCORN_PORT }}
          envs: BURRITO_SECRET_KEY_BASE,DEPLOY_LANDING,DEPLOY_LANGTOUR,DEPLOY_BURRITO
          script: |
            set -euo pipefail
            if [[ "$DEPLOY_LANDING" == "true" ]]; then
              docker compose -f popcorn-landing.yml -p landing pull
              docker compose -f popcorn-landing.yml -p landing up -d
            fi
            if [[ "$DEPLOY_LANGTOUR" == "true" ]]; then
              docker compose -f elixir-langtour.yml -p langtour pull
              docker compose -f elixir-langtour.yml -p langtour up -d
            fi
            if [[ "$DEPLOY_BURRITO" == "true" ]]; then
              docker compose -f popcorn-burrito.yml -p burrito pull
              docker compose -f popcorn-burrito.yml -p burrito up -d
            fi
