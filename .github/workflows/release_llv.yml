name: Release LocalLiveView

# LocalLiveView releases on its own cadence, hence the separate `llv-v*` tag
# namespace (the popcorn release workflows trigger on `v*`).
#
# The JS bundle and the vendored Popcorn runtime files are NOT in git. They are
# built here: `mix hex.publish` runs `mix llv.assets` (wired into the alias in
# local-live-view/mix.exs), which bundles priv/static/ before packaging. That is
# also the guard against publishing a tarball without them.

on:
  push:
    tags:
      - "llv-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to simulate, e.g. llv-v0.1.0"
        required: true
      dry_run:
        description: "Skip actual publish"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.ref }}

      - name: Check versions align
        if: github.ref_type == 'tag' || inputs.tag
        uses: ./.github/actions/check-release-versions
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          prefix: llv-v
          package-json: local-live-view/package.json
          mix-exs: local-live-view/mix.exs

      - name: Setup BEAM runtime and workspace
        uses: ./.github/actions/setup-llv
        with:
          build-mode: release

      - name: Publish to Hex
        working-directory: local-live-view
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          LLV_RELEASE: "1"
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          mix deps.get
          mix compile
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then flags=(--dry-run); fi
          mix hex.publish package --yes "${flags[@]}"
          MIX_ENV=dev mix hex.publish docs --yes "${flags[@]}"
