name: Release Hex Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.4.0-next.0"
        required: true
      dry_run:
        description: "Skip actual publish"
        type: boolean
        default: true

jobs:
  release:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check versions align
        if: github.ref_type == 'tag' || inputs.tag
        uses: ./.github/actions/check-release-versions
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          prefix: v
          package-json: popcorn-2/js/package.json
          mix-exs: popcorn-2/elixir/mix.exs

      - name: Build Docker image
        run: docker build -t popcorn-builder -f docker/release.Dockerfile --build-arg GIT_REF=${{ inputs.tag || github.ref_name }} .

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          docker run --rm -e HEX_API_KEY \
            popcorn-builder \
            sh -c "cd /build/popcorn/popcorn-2/elixir \
              && mix deps.get \
              && mix compile \
              && mix hex.publish package --yes $DRY_RUN_FLAG \
              && MIX_ENV=dev mix hex.publish docs --yes $DRY_RUN_FLAG"

  otp-release:
    if: ${{ contains(inputs.tag || github.ref_name, '-next.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.ref }}
      - uses: ./.github/actions/check-release-versions
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          prefix: v
          package-json: popcorn/js/package.json
          mix-exs: popcorn/elixir/mix.exs
      - id: toolchain
        uses: ./.github/actions/read-otp-toolchain
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          otp-version: ${{ steps.toolchain.outputs.otp }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: pnpm install --frozen-lockfile
      - name: Test and build Hex package
        working-directory: popcorn/elixir
        run: |
          mix deps.get
          mix test
          mix docs --warnings-as-errors
          mix hex.build
      - name: Publish OTP prerelease
        working-directory: popcorn/elixir
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then flags=(--dry-run); fi
          mix hex.publish --yes "${flags[@]}"
