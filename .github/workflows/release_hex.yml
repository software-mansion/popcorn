name: Release Hex Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-next.0"
        required: true
      dry_run:
        description: "Skip actual publish"
        type: boolean
        default: true

jobs:
  otp-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: core
            crypto: "false"
          - variant: crypto
            crypto: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.ref }}
      - uses: ./.github/actions/check-release-versions
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          prefix: v
          package-json: popcorn/js/package.json
          mix-exs: popcorn/elixir/mix.exs
      - id: toolchain
        uses: ./.github/actions/read-otp-toolchain
      - uses: ./.github/actions/build-otp-wasm
        with:
          host-otp-version: ${{ steps.toolchain.outputs.otp }}
          otp-tag: ${{ steps.toolchain.outputs.otp-tag }}
          build-mode: release
          with-crypto: ${{ matrix.crypto }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.variant }}
          path: popcorn/out/runtimes/${{ matrix.variant }}
          if-no-files-found: error

  otp-release:
    needs: otp-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.ref }}
      - uses: ./.github/actions/check-release-versions
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          prefix: v
          package-json: popcorn/js/package.json
          mix-exs: popcorn/elixir/mix.exs
      - id: toolchain
        uses: ./.github/actions/read-otp-toolchain
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          otp-version: ${{ steps.toolchain.outputs.otp }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: runtime-core
          path: popcorn/out/runtimes/core
      - uses: actions/download-artifact@v4
        with:
          name: runtime-crypto
          path: popcorn/out/runtimes/crypto
      - run: pnpm -F ./popcorn/js build
      - name: Test and build Hex package
        working-directory: popcorn/elixir
        run: |
          mix deps.get
          mix test
          mix docs --warnings-as-errors
          mix hex.build
      - name: Publish to Hex
        working-directory: popcorn/elixir
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then flags=(--dry-run); fi
          mix hex.publish --yes "${flags[@]}"
