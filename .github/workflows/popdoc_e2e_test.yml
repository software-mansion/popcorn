name: Popdoc e2e tests

on:
  push:
    branches: ["**"]
    paths:
      - "popdoc/**"
      - ".github/workflows/popdoc_e2e_test.yml"
      - ".github/actions/setup-playwright/action.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"
      - "scripts/test.sh"
      - "scripts/_common.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  e2e:
    name: Popdoc E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.20.4"
          otp-version: "29.0.6"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Elixir dependencies
        run: mix deps.get
        working-directory: popdoc

      - name: Build popdoc runtime assets
        run: mix popdoc.build
        working-directory: popdoc

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          version: "1.60.0"

      - name: Run e2e tests
        run: bash scripts/test.sh --popdoc

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: popdoc-playwright-report
          path: |
            popdoc/e2e/playwright-report/
            popdoc/e2e/test-results/
          retention-days: 7
