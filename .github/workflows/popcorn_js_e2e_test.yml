name: Popcorn JS e2e tests

on:
  push:
    branches: ["**"]
    paths:
      - "popcorn-2/js/**"
      - "popcorn-2/elixir/lib/**/wasm.ex"
      - "popcorn-2/pnpm-lock.yaml"
      - "popcorn-2/pnpm-workspace.yaml"
      - ".github/workflows/popcorn_js_e2e_test.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  e2e:
    name: JS E2E tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24.16.0 broke the zip extraction (and subsequently, Playwright).
          # See https://github.com/nodejs/node/issues/63487.
          node-version: "24.15.0"
          cache: "pnpm"
          cache-dependency-path: popcorn-2/pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: popcorn-2

      - name: Build popcorn JS package
        run: pnpm build:prod
        working-directory: popcorn-2/js

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          version: "1.60.0"

      - name: Run e2e tests
        run: pnpm test:e2e
        working-directory: popcorn-2/js
