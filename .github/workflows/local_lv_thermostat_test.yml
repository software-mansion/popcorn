# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: local-lv-thermostat - Test

on:
  push:
    branches: ["**"]
    paths: &llv_paths
      - "examples/local-lv-thermostat/**"
      - "local-live-view/**"
      - "popcorn/elixir/**"
      - "popcorn/js/**"
      - "popcorn/patches/**"
      - ".github/workflows/local_lv_thermostat_test.yml"
      - ".github/actions/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"

  pull_request:
    paths: *llv_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  MIX_ENV: test

jobs:
  # The online half is a regular Phoenix app that serves the page hosting the
  # LocalLiveView mount points, tested on the BEAM (no Wasm involved).
  online:
    name: Online (Phoenix, BEAM)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: examples/local-lv-thermostat

    steps:
      - uses: actions/checkout@v4

      # Matches the toolchain the local views are built with, see setup-llv.
      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.20.4"
          otp-version: "29.0.6"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: examples/local-lv-thermostat/deps
          key: ${{ runner.os }}-mix-local_lv_thermostat-${{ hashFiles('examples/local-lv-thermostat/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-local_lv_thermostat-

      - name: Install Hex dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  # The offline half is a LocalLiveView app that runs in the browser on
  # Popcorn's Wasm BEAM. Its views are plain Elixir, so they're tested natively.
  offline:
    name: Offline (LocalLiveView)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: examples/local-lv-thermostat/local

    steps:
      - uses: actions/checkout@v4

      - name: Setup LocalLiveView
        uses: ./.github/actions/setup-llv

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: examples/local-lv-thermostat/local/deps
          key: ${{ runner.os }}-mix-local_lv_thermostat_local-${{ hashFiles('examples/local-lv-thermostat/local/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-local_lv_thermostat_local-

      - name: Install Hex dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      # The host app is only exercised here, where the Wasm runtime is built:
      # `mix setup` builds the JS bundle and packages the local views, neither of
      # which is committed.
      - name: Verify setup and phx.server
        uses: ./.github/actions/verify-llv-app
        with:
          working-directory: examples/local-lv-thermostat
