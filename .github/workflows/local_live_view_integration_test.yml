name: LocalLiveView Integration tests

on:
  push:
    branches: ["**"]
    paths: &llv_paths
      - "local-live-view/**"
      - ".github/workflows/local_live_view_integration_test.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

  pull_request:
    paths: *llv_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Use the runner's preinstalled Google Chrome instead of downloading
  # Playwright's bundled chromium (that download hangs on the runner). Read by
  # playwright.config.js.
  PW_CHANNEL: chrome

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: local-live-view/integration_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install
        working-directory: .

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            local-live-view/integration_test/deps
            local-live-view/integration_test/_build
          key: ${{ runner.os }}-mix-llv_integration-${{ hashFiles('local-live-view/integration_test/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-llv_integration-

      - name: Install Hex dependencies
        run: mix deps.get

      # Rebuilds the Wasm bundle and app.js, then runs the Playwright suite
      - name: Run tests
        run: mix test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: llv-integration-playwright-report
          path: |
            local-live-view/integration_test/test/playwright/playwright-report
            local-live-view/integration_test/test/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore
