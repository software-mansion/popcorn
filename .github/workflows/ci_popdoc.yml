name: Popdoc

on:
  push:
    branches: ["**"]
    paths:
      - "popdoc/**"
      - "scripts/test.sh"
      - "scripts/_common.sh"
      - ".github/workflows/ci_popdoc.yml"
      - ".github/actions/read-otp-toolchain/**"
      - ".github/actions/setup-mix-cache/**"
      - ".github/actions/setup-workspace/**"
      - "mise.toml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".npmrc"

concurrency:
  group: ci-popdoc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  PW_CHANNEL: chrome

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          elixir: "true"
          node: "true"

      - uses: ./.github/actions/setup-mix-cache
        with:
          working-directory: popdoc
          mix-env: dev
          extra-paths: |
            popdoc/e2e/fixture/deps
            popdoc/e2e/fixture/_build
          extra-lockfile: popdoc/e2e/fixture/mix.lock

      - name: Fetch Elixir dependencies
        run: mix deps.get
        working-directory: popdoc

      - name: Build popdoc runtime assets
        run: mix popdoc.build
        working-directory: popdoc

      - name: Run e2e tests
        run: bash scripts/test.sh --popdoc

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: popdoc-playwright-report
          path: |
            popdoc/e2e/playwright-report/
            popdoc/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
